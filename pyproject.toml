[project]
name = "agentpad"
version = "0.1.0"
description = "Use the SDINNOVATION SIDE-KEYBOARD as a controller for herdr workspaces and agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentpad = "agentpad.daemon:main"
side-keyboard-keys = "agentpad.keys:main"
side-keyboard-led = "agentpad.led:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/diagrams.py" = ["E501"] # SVG drawing: long literal strings read better unwrapped
