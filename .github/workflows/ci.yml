name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: extractions/setup-just@v4
      - run: just lint

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: extractions/setup-just@v4
      - run: just test -v

  deb:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Build the .deb and smoke-test it in a clean container
        run: just deb-test
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
